<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfa · Проверка интеграции</title><style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 20px;background:#f5f5f5;color:#222}button,select,input{font:inherit;padding:10px;margin:4px}button{background:#df1425;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:20px;overflow:auto;border-radius:12px}#status{font-weight:600}a{color:#b60019}</style>
<h1>Проверка интеграции Python ↔ Node.js</h1><p>Учебные данные и моки. Это технический стенд для пяти разработчиков.</p>
<p><a href="/analysis/">Открыть анализ новости с выбором компании и источниками</a></p>
<label>Компания <select id="company"></select></label><button id="run">Профиль → новости → ранжирование → анализ</button>
<p id="status" role="status">Загрузка…</p><pre id="result"></pre>
<label>Уточнение <input id="question" value="Что уточнить в договорах?"></label><button id="ask" disabled>Задать вопрос</button>
<p><a href="/">Открыть существующий интерфейс (/api)</a></p>
<script type="module">
import { AlfaApi } from '/integration/client.js';
const api = new AlfaApi(), el = id => document.getElementById(id); let analysis, generation = 0, controller;
function show(value) { el('result').textContent = JSON.stringify(value, null, 2); }
function error(e) { el('status').textContent = `${e.code || 'ERROR'}: ${e.message}; request_id=${e.requestId || '—'}`; }
try { const value = await api.companies(); for (const id of value.data.items) { const option = document.createElement('option'); option.value = option.textContent = id; el('company').append(option); } el('status').textContent = 'Готово'; } catch(e) { error(e); }
el('company').onchange = () => { generation++; controller?.abort(); analysis = undefined; el('ask').disabled = true; el('run').disabled = false; el('status').textContent = 'Выбрана другая компания'; show({}); };
el('run').onclick = async () => { const current = ++generation, cid = el('company').value, asOf = new Date().toISOString(); controller?.abort(); controller = new AbortController(); const signal = controller.signal; el('run').disabled = true; el('ask').disabled = true; el('status').textContent = 'Выполняется…';
  try { const profile = await api.profile(cid, signal), news = await api.search('', asOf, signal), rank = await api.rank(cid, news.data.items, asOf, signal); if (!rank.data.items.length) throw new Error('Нет новостей на выбранную дату'); const result = await api.analyze(cid, rank.data.items[0].news_id, asOf, signal); if(current !== generation) return; analysis = result.data; show({profile, rank, analysis: result}); el('status').textContent = `Готово · mode=${result.meta.mode} · ${result.meta.warnings.join(', ')}`; el('ask').disabled = false; } catch(e) { if(current === generation) error(e); } finally { if(current === generation) el('run').disabled = false; } };
el('ask').onclick = async () => { if(!analysis) return; const current = generation; el('ask').disabled = true; try { const result = await api.question(analysis.id, analysis.company_id, el('question').value, controller?.signal); if(current === generation) show(result); } catch(e) { if(current === generation) error(e); } finally { if(current === generation) el('ask').disabled = false; } };
</script></html>
