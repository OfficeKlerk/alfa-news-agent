name: integration
on:
  pull_request:
  push:
    branches: [master, "feature/**", "role5/**"]
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: npm ci
      - run: python -m pip install -r requirements-dev.txt -c requirements.lock
      - run: python scripts/build_contracts.py --check
      - run: npm run typecheck && npm test && npm run build
      - run: npm run llm:evaluate
      - name: Validate bundled news module and contracts
        run: python scripts/prepare_news_source.py
      - run: python -m pytest tests -q
      - run: python scripts/dev.py --smoke
      - run: RANK_MODE=news-analysis AGENT_MODE=legacy python scripts/dev.py --smoke
      - run: RANK_MODE=news-analysis python scripts/dev.py --smoke --native-providers
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python scripts/smoke.py http://127.0.0.1:8000
      - if: always()
        run: docker compose logs --no-color --tail=100
      - if: always()
        run: docker compose down --volumes
