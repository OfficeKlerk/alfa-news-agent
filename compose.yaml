name: alfa-news-integration
services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      ML_URL: ${ML_URL:-http://ml:8101}
      RETRIEVAL_MODE: ${RETRIEVAL_MODE:-http}
      RETRIEVAL_URL: ${RETRIEVAL_URL:-http://mocks:8102}
      AGENT_MODE: ${AGENT_MODE:-http}
      AGENT_URL: ${AGENT_URL:-http://mocks:8102}
      LLM_MODE: ${LLM_MODE:-demo}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_object}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_EXTRA_BODY_JSON: ${LLM_EXTRA_BODY_JSON:-}
      MAX_DAILY_LLM_CALLS: ${MAX_DAILY_LLM_CALLS:-100}
      NEWS_FEEDS_JSON: ${NEWS_FEEDS_JSON:-[]}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-6000}
      LLM_MAX_PLANNING_TOKENS: ${LLM_MAX_PLANNING_TOKENS:-6000}
      INTEGRATION_LOG: ${INTEGRATION_LOG:-0}
    volumes:
      - node-state:/app/var
    depends_on:
      ml:
        condition: service_healthy
      mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
    init: true
  ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    environment:
      CONTEXT_MODE: fixture
      CONTEXT_DB: /app/var/integration/context.sqlite3
      RANK_MODE: mock
    volumes:
      - python-state:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/v1/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
  mocks:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command: ["node", "dist/integration/mock-server.js"]
    environment:
      HOST: 0.0.0.0
      PORT: 8102
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8102/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
    init: true
volumes:
  node-state:
  python-state:
