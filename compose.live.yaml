name: alfa-news-live
services:
  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    ports:
    - 127.0.0.1:${GATEWAY_PORT:-8000}:8000
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DB_PATH: /app/var/gateway.sqlite3
      DATA_DIR: /app/data
      LLM_MODE: live
      LLM_API_KEY: ''
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-0}
      LIVE_PIPELINE_ENABLED: '1'
      LIVE_SCAN_SECONDS: ${LIVE_SCAN_SECONDS:-60}
      LIVE_LOOKBACK_DAYS: ${LIVE_LOOKBACK_DAYS:-7}
      LIVE_MAX_CANDIDATES: ${LIVE_MAX_CANDIDATES:-500}
      LIVE_COMPANY_NEWS_LIMIT: ${LIVE_COMPANY_NEWS_LIMIT:-5}
      LIVE_MAX_COMPANIES: ${LIVE_MAX_COMPANIES:-100}
      LIVE_WORKER_CONCURRENCY: ${LIVE_WORKER_CONCURRENCY:-1}
      LIVE_COMPANY_IDS_JSON: ${LIVE_COMPANY_IDS_JSON:-[]}
      NEWS_SEED_MODE: none
      NEWS_ENABLED: '0'
      ML_URL: http://ml:8101
      RETRIEVAL_MODE: http
      RETRIEVAL_URL: http://retrieval:8102
      AGENT_MODE: http
      AGENT_URL: http://agent:8202
      AUTH_MODE: oidc
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set random private service credential}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Configure trusted OIDC and HTTPS}
      OIDC_ISSUER: ${OIDC_ISSUER:?Configure trusted OIDC and HTTPS}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Configure trusted OIDC and HTTPS}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Configure trusted OIDC and HTTPS}
      AUTH_COOKIE_KEY: ${AUTH_COOKIE_KEY:?Configure trusted OIDC and HTTPS}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    volumes:
    - live-gateway-state:/app/var
    depends_on:
      ml:
        condition: service_healthy
      retrieval:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8000/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 6
    restart: unless-stopped
    stop_grace_period: 35s
    init: true
  ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    environment:
      CONTEXT_MODE: existing
      CONTEXT_DB: /app/context/companies.sqlite
      RANK_MODE: news-analysis
      NEWS_MODULE_PATH: /app
      AUTH_MODE: oidc
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set random private service credential}
    volumes:
    - type: bind
      source: ${CONTEXT_DB_HOST_PATH:?Set CONTEXT_DB_HOST_PATH to an existing company-context
        SQLite file}
      target: /app/context/companies.sqlite
      read_only: true
      bind:
        create_host_path: false
    - live-ml-state:/app/var
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/v1/health',timeout=3)
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 35s
    init: true
  retrieval:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command:
    - node
    - dist/integration/provider-server.js
    environment:
      HOST: 0.0.0.0
      PORT: 8102
      SERVICE_KIND: retrieval
      DB_PATH: /app/var/retrieval.sqlite3
      DATA_DIR: /app/data
      LLM_MODE: live
      LLM_API_KEY: ''
      ANALYSIS_ENABLED: '0'
      NEWS_SEED_MODE: none
      NEWS_ENABLED: '1'
      NEWS_POLL_SECONDS: ${NEWS_POLL_SECONDS:-300}
      NEWS_FULL_TEXT_ENABLED: '1'
      NEWS_SOURCE_CONCURRENCY: ${NEWS_SOURCE_CONCURRENCY:-3}
      NEWS_FULL_TEXT_CONCURRENCY: ${NEWS_FULL_TEXT_CONCURRENCY:-3}
      NEWS_FULL_TEXT_REFRESH_SECONDS: ${NEWS_FULL_TEXT_REFRESH_SECONDS:-3600}
      NEWS_FULL_TEXT_MAX_PER_SOURCE: ${NEWS_FULL_TEXT_MAX_PER_SOURCE:-20}
      NEWS_FEEDS_JSON: ${NEWS_FEEDS_JSON:?Set NEWS_FEEDS_JSON to a nonempty JSON array
        of HTTPS feed URLs}
      AUTH_MODE: oidc
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set random private service credential}
    volumes:
    - live-retrieval-state:/app/var
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8102/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 35s
    init: true
  agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.node
    command:
    - node
    - dist/integration/provider-server.js
    environment:
      HOST: 0.0.0.0
      PORT: 8202
      SERVICE_KIND: agent
      DB_PATH: /app/var/agent.sqlite3
      DATA_DIR: /app/data
      LLM_MODE: live
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-0}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://changellenge.up.railway.app/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.6-35b-a3b}
      LLM_RESPONSE_FORMAT: ${LLM_RESPONSE_FORMAT:-json_object}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      LLM_EXTRA_BODY_JSON: ${LLM_EXTRA_BODY_JSON:-}
      LLM_STRICT_EXTRA_BODY_JSON: ${LLM_STRICT_EXTRA_BODY_JSON:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-6000}
      LLM_MAX_PLANNING_TOKENS: ${LLM_MAX_PLANNING_TOKENS:-6000}
      LLM_GENERATION_MAX_TOKENS: ${LLM_GENERATION_MAX_TOKENS:-2500}
      MAX_DAILY_LLM_CALLS: ${MAX_DAILY_LLM_CALLS:-100}
      MAX_DAILY_LLM_TOKENS: ${MAX_DAILY_LLM_TOKENS:-2000000}
      MAX_COMPANY_DAILY_LLM_CALLS: ${MAX_COMPANY_DAILY_LLM_CALLS:-20}
      LLM_QUESTION_RESERVE_CALLS: ${LLM_QUESTION_RESERVE_CALLS:-10}
      LLM_QUESTION_RESERVE_TOKENS: ${LLM_QUESTION_RESERVE_TOKENS:-200000}
      LLM_MAX_CONTEXT_BYTES: ${LLM_MAX_CONTEXT_BYTES:-200000}
      LLM_MAX_RESPONSE_BYTES: ${LLM_MAX_RESPONSE_BYTES:-1000000}
      NEWS_SEED_MODE: none
      NEWS_ENABLED: '0'
      AUTH_MODE: oidc
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set random private service credential}
    volumes:
    - live-agent-state:/app/var
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:8202/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 35s
    init: true
volumes:
  live-gateway-state: null
  live-ml-state: null
  live-retrieval-state: null
  live-agent-state: null
