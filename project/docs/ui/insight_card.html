<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карточка инсайта — референс (факт / банк / AI)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --alfa-red:#EF3124; --ink:#1a1a1a; --muted:#6b7280; --line:#e6e7eb;
    --bg:#f5f6f8; --card:#ffffff; --fact:#f3f4f6; --bank:#fff1f0; --ai:#eef4fb;
    --ai-ink:#1d4ed8; --ok:#15803d; --warn:#b45309; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  a,button{transition:color .2s ease,background-color .2s ease,border-color .2s ease}
  :focus-visible{outline:2px solid var(--alfa-red);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;padding:8px 0 16px}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--alfa-red);display:grid;place-items:center;
    color:#fff;font-weight:800;font-family:Georgia,serif}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{color:var(--muted);font-size:12px}

  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
  .seg button.active{background:var(--alfa-red);color:#fff}
  .state-btns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
  .state-btns button.active{border-color:var(--alfa-red);color:var(--alfa-red)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(16,24,40,.04);overflow:hidden}
  .card .top{padding:16px 18px;border-bottom:1px solid var(--line)}
  .relrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.02em}
  .pill.high{background:#fde8e6;color:var(--alfa-red)}
  .pill.mid{background:#fff4e5;color:var(--warn)}
  .pill.low{background:#eef1f4;color:var(--muted)}
  .company{font-size:12px;color:var(--muted)}
  .title{font-size:18px;font-weight:700;margin:2px 0 6px}
  .meta{font-size:12px;color:var(--muted)}

  .body{padding:8px 18px 18px}
  .block{border-radius:12px;padding:12px 14px;margin-top:12px}
  .block .lbl{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.04em;margin-bottom:6px}
  .dot{width:8px;height:8px;border-radius:50%}
  .b-fact{background:var(--fact)} .b-fact .dot{background:#9ca3af} .b-fact .lbl{color:#4b5563}
  .b-bank{background:var(--bank);border:1px solid #ffd9d4} .b-bank .dot{background:var(--alfa-red)} .b-bank .lbl{color:var(--alfa-red)}
  .b-bank.none{background:#fafafa;border:1px dashed var(--line)} .b-bank.none .dot{background:#cbd5e1} .b-bank.none .lbl{color:var(--muted)}
  .b-ai{background:var(--ai);border:1px solid #d6e4fb} .b-ai .dot{background:var(--ai-ink)} .b-ai .lbl{color:var(--ai-ink)}
  .block p{margin:0;font-size:14px}
  .conf{font-size:11px;color:var(--muted);margin-top:6px}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.cols{grid-template-columns:1fr}}
  .mini{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .mini h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .mini.risk h4{color:var(--alfa-red)} .mini.opp h4{color:var(--ok)}
  .mini ul{margin:0;padding-left:18px;font-size:14px} .mini li{margin:3px 0}

  .src{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;
    text-decoration:none;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
  .chip:hover{border-color:var(--alfa-red);color:var(--alfa-red)}
  .chip .k{color:var(--muted)}
  .why-evi{font-size:11px;color:var(--muted);margin-top:6px}
  .actions li{margin:3px 0;font-size:14px}

  /* states */
  .state{padding:40px 18px;text-align:center;color:var(--muted)}
  .skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#eee,#f6f6f6,#eee);
    background-size:200% 100%;animation:sh 1.2s infinite} @keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .skel.big{height:22px;width:60%} .skel.row{margin-top:10px} .skel.w40{width:40%}.skel.w80{width:80%}
  .err{color:var(--alfa-red)} .hint{font-size:12px;margin-top:6px}
  footer{color:var(--muted);font-size:11px;text-align:center;padding:18px 0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin:10px 0 0}
  .legend span{display:inline-flex;gap:6px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">A</div>
    <div>
      <h1>Альфа-Бизнес · Новостной инсайт</h1>
      <div class="sub">Референс-карточка роли 4 · разделение факт / позиция банка / вывод AI</div>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="companySeg"></div>
    <div class="seg state-btns" id="stateSeg">
      <button data-state="ready" class="active">Данные</button>
      <button data-state="loading">Загрузка</button>
      <button data-state="empty">Пусто</button>
      <button data-state="error">Ошибка</button>
    </div>
  </div>

  <div id="view"></div>

  <div class="legend">
    <span><span class="dot" style="background:#9ca3af"></span>Факт из новости</span>
    <span><span class="dot" style="background:var(--alfa-red)"></span>Позиция Альфа-Банка</span>
    <span><span class="dot" style="background:var(--ai-ink)"></span>Вывод AI</span>
  </div>

  <footer>Прототип. Данные синтетические (is_mock). Связь вывод→источник обязательна; где у банка нет материала — честно помечается.</footer>
</div>

<script>
// --- демо-данные (3 компании × новость), источник: demo_companies.json + demo_news.json + news_bank_mapping.json ---
const INSIGHTS = {
  "U_34911|grain-export-duty": {
    company:{id:"U_34911",name:"Экспортёр зерна",sector:"Оптовая торговля зерном · Ростовская область"},
    news:{title:"Повышена экспортная пошлина на зерно",date:"2026-10-10",source:{name:"demo",url:"https://example.invalid/news/grain-export-duty"}},
    relevance:{label:"высокая",cls:"high"},
    fact:"Экспортная пошлина на зерновые скорректирована в сторону повышения.",
    why:"Основная деятельность — оптовый экспорт зерна (Алжир, Индия, ОАЭ). Пошлина напрямую влияет на экспортную маржу.",
    whyEvi:"/industry · /foreign_trade/countries",
    risks:["Снижение экспортной выручки при росте пошлины","Давление на маржу по действующим контрактам"],
    opps:["Переориентация части объёмов на внутренний рынок","Пересмотр условий поставок с покупателями"],
    bank:{available:false},
    ai:{text:"Для экспортёра зерна эффект вероятен и прямой, но величина зависит от доли экспорта и условий контрактов (неизвестны).",conf:"средняя"},
    actions:["Оценить долю экспорта под новую пошлину","Уточнить, кто несёт пошлину по контрактам"],
    sources:[{t:"Новость: пошлина на зерно",u:"https://example.invalid/news/grain-export-duty"}]
  },
  "U_34911|rate-hold-2026-09": {
    company:{id:"U_34911",name:"Экспортёр зерна",sector:"Оптовая торговля зерном · Ростовская область"},
    news:{title:"ЦБ сохранил ключевую ставку на уровне 14%",date:"2026-09-11",source:{name:"demo",url:"https://example.invalid/news/rate-hold"}},
    relevance:{label:"средняя",cls:"mid"},
    fact:"Банк России сохранил ключевую ставку на уровне 14%; риторика осталась жёсткой.",
    why:"У компании есть кредитные продукты → стоимость обслуживания долга остаётся высокой.",
    whyEvi:"/bank_products/loan",
    risks:["Стоимость заёмного финансирования не снизится в ближайшей перспективе"],
    opps:["Возможность зафиксировать условия по новым траншам при появлении смягчения"],
    bank:{available:true,
      text:"ЦМИ Альфа-Банка: пауза в снижении ставки, риторика регулятора ужесточилась — период дорогих денег продлевается.",
      source:{doc:"ALFA-Macro_Insights-Policy_Rate_11Sep.pdf",page:1}},
    ai:{text:"Эффект зависит от остатка долга и условий переоценки ставки по договору (неизвестны).",conf:"средняя"},
    actions:["Сверить график погашения и условия переоценки ставки"],
    sources:[{t:"Новость: решение по ставке",u:"https://example.invalid/news/rate-hold"},
             {t:"ЦМИ: Policy Rate 11 Sep",u:"#"}]
  },
  "U_4909|rate-hold-2026-09": {
    company:{id:"U_4909",name:"Генерация электроэнергии (ТЭС)",sector:"Энергетика · Москва"},
    news:{title:"ЦБ сохранил ключевую ставку на уровне 14%",date:"2026-09-11",source:{name:"demo",url:"https://example.invalid/news/rate-hold"}},
    relevance:{label:"низкая",cls:"low"},
    fact:"Банк России сохранил ключевую ставку на уровне 14%.",
    why:"У компании НЕ отмечено кредитных продуктов → прямого канала влияния ставки на неё нет.",
    whyEvi:"/bank_products (кредитов нет)",
    risks:[],
    opps:[],
    bank:{available:false},
    ai:{text:"Для этой компании новость малозначима: в профиле нет кредитов/лизинга/факторинга. Показано для контраста персонализации.",conf:"высокая"},
    actions:[],
    sources:[{t:"Новость: решение по ставке",u:"https://example.invalid/news/rate-hold"}]
  }
};
const ORDER = ["U_34911|grain-export-duty","U_34911|rate-hold-2026-09","U_4909|rate-hold-2026-09"];
const LABELS = {"U_34911|grain-export-duty":"Зерно × пошлина","U_34911|rate-hold-2026-09":"Зерно × ставка","U_4909|rate-hold-2026-09":"Энергетика × ставка"};

let current = ORDER[0], state = "ready";

function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function bankBlock(b){
  if(b.available){
    return `<div class="block b-bank">
      <span class="lbl"><span class="dot"></span>Позиция Альфа-Банка</span>
      <p>${esc(b.text)}</p>
      <div class="src"><a class="chip" href="#"><span class="k">ЦМИ:</span> ${esc(b.source.doc)} · c.${b.source.page}</a></div>
    </div>`;
  }
  return `<div class="block b-bank none">
    <span class="lbl"><span class="dot"></span>Позиция Альфа-Банка — нет материала</span>
    <p>По этой теме у банка нет профильной аналитики. Позиция банка не формируется; вывод ниже сделан AI.</p>
  </div>`;
}
function list(items){return items.map(x=>`<li>${esc(x)}</li>`).join("")}

function renderReady(){
  const d = INSIGHTS[current];
  const risks = d.risks.length?`<div class="mini risk"><h4>Риски</h4><ul>${list(d.risks)}</ul></div>`:"";
  const opps = d.opps.length?`<div class="mini opp"><h4>Возможности</h4><ul>${list(d.opps)}</ul></div>`:"";
  const cols = (risks||opps)?`<div class="cols">${risks}${opps}</div>`:"";
  const actions = d.actions.length?`<div class="block" style="background:#fff;border:1px solid var(--line)">
      <span class="lbl" style="color:var(--muted)"><span class="dot" style="background:#9ca3af"></span>Возможные действия</span>
      <ul class="actions" style="margin:0;padding-left:18px">${list(d.actions)}</ul></div>`:"";
  return `<div class="card">
    <div class="top">
      <div class="relrow">
        <span class="company">${esc(d.company.name)} · ${esc(d.company.sector)}</span>
        <span class="pill ${d.relevance.cls}">релевантность: ${esc(d.relevance.label)}</span>
      </div>
      <div class="title">${esc(d.news.title)}</div>
      <div class="meta">${esc(d.news.date)} · источник: demo</div>
    </div>
    <div class="body">
      <div class="block b-fact"><span class="lbl"><span class="dot"></span>Что произошло · факт</span><p>${esc(d.fact)}</p></div>
      <div class="block" style="background:#fff;border:1px solid var(--line)">
        <span class="lbl" style="color:#4b5563"><span class="dot" style="background:#9ca3af"></span>Почему важно этой компании</span>
        <p>${esc(d.why)}</p><div class="why-evi">признак: ${esc(d.whyEvi)}</div>
      </div>
      ${cols}
      ${bankBlock(d.bank)}
      <div class="block b-ai">
        <span class="lbl"><span class="dot"></span>Вывод AI</span>
        <p>${esc(d.ai.text)}</p><div class="conf">уверенность: ${esc(d.ai.conf)} · сформировано моделью, не позиция банка</div>
      </div>
      ${actions}
      <div class="block" style="background:#fff;border:1px solid var(--line)">
        <span class="lbl" style="color:var(--muted)"><span class="dot" style="background:#9ca3af"></span>На чём основано · источники</span>
        <div class="src">${d.sources.map(s=>`<a class="chip" href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`).join("")}</div>
      </div>
    </div>
  </div>`;
}
function renderLoading(){return `<div class="card"><div class="state">
  <div class="skel big"></div><div class="skel row w80"></div><div class="skel row w40"></div>
  <div class="skel row"></div><div class="skel row w80"></div></div></div>`}
function renderEmpty(){return `<div class="card"><div class="state">
  <div style="font-size:15px;color:var(--ink);font-weight:600">Пока нет значимых событий</div>
  <div class="hint">Для этой компании в выбранном периоде нет новостей выше порога релевантности.</div></div></div>`}
function renderError(){return `<div class="card"><div class="state">
  <div class="err" style="font-weight:700">Не удалось загрузить анализ</div>
  <div class="hint">Проверьте соединение. Данные не подменяются demo молча — показана честная ошибка.</div>
  <div class="hint">request_id: 5d2292…</div></div></div>`}

function render(){
  const v=document.getElementById("view");
  v.innerHTML = state==="loading"?renderLoading():state==="empty"?renderEmpty():state==="error"?renderError():renderReady();
}
function buildCompanySeg(){
  const seg=document.getElementById("companySeg");
  seg.innerHTML=ORDER.map(k=>`<button data-k="${k}" class="${k===current?'active':''}">${LABELS[k]}</button>`).join("");
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{current=b.dataset.k;state="ready";syncState();buildCompanySeg();render()});
}
function syncState(){document.querySelectorAll("#stateSeg button").forEach(b=>b.classList.toggle("active",b.dataset.state===state))}
document.querySelectorAll("#stateSeg button").forEach(b=>b.onclick=()=>{state=b.dataset.state;syncState();render()});
buildCompanySeg();render();
</script>
</body>
</html>
